apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "msgbus-ws.fullname" . }}
  labels:
    {{- include "msgbus-ws.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate          # RWO volume can't be multi-attached during rollout
  selector:
    matchLabels:
      {{- include "msgbus-ws.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "msgbus-ws.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
      {{- if .Values.persistence.enabled }}
      initContainers:
        # hostPath volumes ignore fsGroup, so chown the store to the app uid once.
        - name: fix-perms
          image: {{ include "msgbus-ws.image" . }}
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: msgbus-ws
          image: {{ include "msgbus-ws.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          args: ["--port", "8787", "--bind", "0.0.0.0", "--store", "/data"]
          env:
            - name: MSGBUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "msgbus-ws.secretName" . }}
                  key: MSGBUS_TOKEN
          ports:
            - name: http
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "msgbus-ws.fullname" . }}-data
      {{- end }}
