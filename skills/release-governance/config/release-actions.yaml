# AIWF Release Action Taxonomy Configuration
version: "1.0.0"

actions:
  BUILD_ARTIFACT:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "BUILD"

  GENERATE_CHECKSUM:
    requires_approval: false
    side_effect: "NONE"

  SIGN_ARTIFACT:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "SECURITY"

  PUBLISH_PACKAGE:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "NETWORK_WRITE"

  PUSH_IMAGE:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "NETWORK_WRITE"

  DEPLOY:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "DEPLOYMENT"

  APPLY_MIGRATION:
    requires_approval: true
    approval_type: "RELEASE_APPROVAL"
    side_effect: "MIGRATION"
