profile_id: kotlin-strict-v1
language: Kotlin
strict: true
extensions: [.kt, .kts]
filenames: []
materialized_extension: .kt
parser: profile-aware-static
forbidden_patterns:
  - "TODO_ONLY"
  - "ELLIPSIS_AS_IMPLEMENTATION"
  - "PLACEHOLDER_CODE"
  - "TRUNCATED_SNIPPET"
gate_checks:
  - metadata_complete
  - profile_resolved
  - placeholder_scan
  - materialize_only_under_agents_tmp
  - architecture_boundary_check
reference_tools_not_executed_by_default: [kotlinc, gradle]
project_tests: NOT_RUN
