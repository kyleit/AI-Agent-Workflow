profile_id: shell-strict-v1
language: Shell
strict: true
extensions: [.sh, .bash, .zsh]
filenames: []
materialized_extension: .sh
parser: profile-aware-static
forbidden_patterns:
  - "TODO_ONLY"
  - "ELLIPSIS_AS_IMPLEMENTATION"
  - "PLACEHOLDER_CODE"
  - "TRUNCATED_SNIPPET"
gate_checks:
  - metadata_complete
  - profile_resolved
  - placeholder_scan
  - materialize_only_under_agents_tmp
  - architecture_boundary_check
reference_tools_not_executed_by_default: [shellcheck, bats]
project_tests: NOT_RUN
