profile_id: terraform-strict-v1
language: Terraform
strict: true
extensions: [.tf, .tfvars]
filenames: []
materialized_extension: .tf
parser: profile-aware-static
forbidden_patterns:
  - "TODO_ONLY"
  - "ELLIPSIS_AS_IMPLEMENTATION"
  - "PLACEHOLDER_CODE"
  - "TRUNCATED_SNIPPET"
gate_checks:
  - metadata_complete
  - profile_resolved
  - placeholder_scan
  - materialize_only_under_agents_tmp
  - architecture_boundary_check
reference_tools_not_executed_by_default: [terraform validate]
project_tests: NOT_RUN
