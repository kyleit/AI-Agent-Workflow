profile_id: powershell-strict-v1
language: PowerShell
strict: true
extensions: [.ps1, .psm1, .psd1]
filenames: []
materialized_extension: .ps1
parser: profile-aware-static
forbidden_patterns:
  - "TODO_ONLY"
  - "ELLIPSIS_AS_IMPLEMENTATION"
  - "PLACEHOLDER_CODE"
  - "TRUNCATED_SNIPPET"
gate_checks:
  - metadata_complete
  - profile_resolved
  - placeholder_scan
  - materialize_only_under_agents_tmp
  - architecture_boundary_check
reference_tools_not_executed_by_default: [PSScriptAnalyzer, Pester]
project_tests: NOT_RUN
