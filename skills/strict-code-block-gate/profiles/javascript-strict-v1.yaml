profile_id: javascript-strict-v1
language: JavaScript
strict: true
extensions: [.js, .jsx, .mjs, .cjs]
filenames: []
materialized_extension: .js
parser: profile-aware-static
forbidden_patterns:
  - "TODO_ONLY"
  - "ELLIPSIS_AS_IMPLEMENTATION"
  - "PLACEHOLDER_CODE"
  - "TRUNCATED_SNIPPET"
gate_checks:
  - metadata_complete
  - profile_resolved
  - placeholder_scan
  - materialize_only_under_agents_tmp
  - architecture_boundary_check
reference_tools_not_executed_by_default: [eslint, jest]
project_tests: NOT_RUN
